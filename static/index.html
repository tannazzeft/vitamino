mkdir -p static && cat << 'EOF' > static/index.html
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vitamino Shop</title>
</head>
<body>
  <h1>فروشگاه Vitamino — نسخه تست</h1>
  <div id="products"></div>

  <script>
    async function load() {
      const res = await fetch('/shop/products');
      const data = await res.json();
      const div = document.getElementById('products');
      data.products.forEach(p => {
        const el = document.createElement('div');
        el.innerHTML = '<h3>' + p.title + ' — ' + p.price + ' تومان</h3><p>' + p.description + '</p><button onclick="buy(' + p.id + ',' + p.price + ')">خرید</button>';
        div.appendChild(el);
      });
    }
    function buy(id, price){
      const checkout = {
        user_id: "TEST_USER",
        items: [{product_id:id, qty:1}],
        total: price,
      };
      fetch('/payment/checkout', {
        method:'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(checkout)
      }).then(r=>r.json()).then(j=>{
        if(j.payment_url) window.location = j.payment_url;
        else alert("خطا در ایجاد پرداخت");
      });
    }
    load();
  </script>
</body>
</html>
EOF
